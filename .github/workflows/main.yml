name: Build apps and publish web
on:
  workflow_dispatch:
  push: { tags: ['v*'] }
permissions: { contents: write, pages: write, id-token: write }
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            cmd: npx electron-builder --win --publish never
          - os: macos-latest
            cmd: npx electron-builder --mac --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Put web files in app/
        shell: bash
        run: mkdir -p app && cp index.html app.js stats.js import.js app/
      - run: npm install
      - run: node scripts-prebuild.js
      - run: ${{ matrix.cmd }}
      - uses: actions/upload-artifact@v4
        with:
          name: graph-maker-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
      - name: Attach to GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
  web:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p app && cp index.html app.js stats.js import.js app/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: app }
      - id: d
        uses: actions/deploy-pages@v4
