name: Build desktop apps
on:
  workflow_dispatch:
  push: { tags: ['v*'] }
permissions: { contents: write }
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            cmd: npx electron-builder --win
          - os: macos-latest
            cmd: npx electron-builder --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: node scripts-prebuild.js
      - run: ${{ matrix.cmd }}
      - uses: actions/upload-artifact@v4
        with:
          name: graph-maker-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
      - name: Attach to GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
