<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graph Maker – plots &amp; statistics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --line:#e3e6eb; --ink:#1c2230; --ink2:#5a6372; --ink3:#8a93a2;
  --accent:#2457c5; --accent-soft:#e8eefc; --good:#1a7f4b; --warn:#b45309; --bad:#b42318;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header h1{font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em}
header .sub{color:var(--ink3);font-size:12.5px}
header .sp{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:#c5cad3;background:#fafbfc}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#1c47a6}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main{display:grid;grid-template-columns:372px minmax(0,1fr);gap:16px;padding:16px 20px;max-width:1700px;margin:0 auto}
@media(max-width:980px){main{grid-template-columns:1fr}}
aside{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.card>summary,.card>.hd{padding:11px 14px;font-weight:600;font-size:13px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
.card>summary::-webkit-details-marker{display:none}
.card>summary::after{content:"▾";margin-left:auto;color:var(--ink3);font-size:11px}
.card:not([open])>summary::after{content:"▸"}
.card .bd{padding:2px 14px 14px;display:flex;flex-direction:column;gap:9px}
.num{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:11.5px;font-weight:600}
.row{display:grid;grid-template-columns:118px 1fr;gap:8px;align-items:center;font-size:13px}
.row>span{color:var(--ink2)}
.row.chk{grid-template-columns:1fr auto}
.row select,.row input[type=text],.row input[type=number]{width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;min-width:0}
.row input[type=range]{width:100%}
.row input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
.hint{font-size:12px;color:var(--ink3)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#eef0f4;padding:3px;border-radius:9px}
.seg button{border:0;background:transparent;padding:6px 2px;border-radius:7px;cursor:pointer;font-weight:500;font-size:12.5px;color:var(--ink2)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(20,30,50,.12)}
.btns{display:flex;flex-wrap:wrap;gap:6px}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;resize:vertical}
.drop{border:1.5px dashed #c5cbd6;border-radius:9px;padding:12px;text-align:center;color:var(--ink2);font-size:13px;cursor:pointer;background:#fafbfd}
.drop.on{border-color:var(--accent);background:var(--accent-soft)}
.cols{display:flex;flex-wrap:wrap;gap:5px}
.cols label{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:2px 9px 2px 7px;font-size:12px;cursor:pointer;background:#fff}
.cols input{accent-color:var(--accent);margin:0}
.preview{max-height:150px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.preview table{border-collapse:collapse;width:100%;font-size:11.5px}
.preview th,.preview td{padding:3px 7px;border-bottom:1px solid #eef0f4;text-align:left;white-space:nowrap}
.preview th{position:sticky;top:0;background:#f6f7f9;font-weight:600}
section.out{display:flex;flex-direction:column;gap:16px;min-width:0}
.chartcard{padding:14px}
#chartbox{overflow:auto}
#chartbox svg{width:100%;height:auto;display:block;max-width:100%}
.empty{padding:60px 20px;text-align:center;color:var(--ink3)}
.err{background:#fef3f2;border:1px solid #fecdca;color:var(--bad);padding:10px 12px;border-radius:8px;font-size:13px}
.statscard{padding:6px 16px 16px}
.statscard h3{font-size:13px;margin:16px 0 6px;font-weight:600}
.statscard h3:first-child{margin-top:10px}
.tbl{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
.tbl th{text-align:right;color:var(--ink2);font-weight:500;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{text-align:right;padding:5px 8px;border-bottom:1px solid #f0f2f5;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tr.sig td{background:#f1f7f2}
.tblwrap{overflow:auto;max-height:340px;border:1px solid var(--line);border-radius:8px}
.tblwrap .tbl th{position:sticky;top:0;background:#f6f7f9}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600}
.pill.s{background:#e3f3e9;color:var(--good)} .pill.n{background:#eef0f4;color:var(--ink2)}
.callout{background:var(--accent-soft);border-radius:8px;padding:9px 12px;font-size:13px}
.callout.warn{background:#fff6e5;color:#7a4a05}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
#tip{position:fixed;pointer-events:none;background:#1c2230;color:#fff;padding:6px 9px;border-radius:7px;font-size:12px;line-height:1.4;z-index:50;display:none;max-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1c2230;color:#fff;padding:9px 14px;border-radius:9px;font-size:13px;z-index:60;display:none}
.legendnote{font-size:12px;color:var(--ink3);margin-top:8px}

.pal .pl{font-size:12px;font-weight:600;color:#3b4252;margin:2px 0 6px}.pal .pl.sub{font-weight:400;color:#6b7280;margin-top:10px}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.preset{display:flex;flex-direction:column;gap:5px;align-items:flex-start;padding:7px 8px;border:1px solid #d5d9e0;border-radius:8px;background:#fff;font:inherit;font-size:12px;cursor:pointer;color:#262b36}
.preset[aria-pressed=true]{border-color:#2f6fed;box-shadow:0 0 0 2px #2f6fed33}
.preset .sw{display:flex;width:100%;height:12px;border-radius:3px;overflow:hidden}.preset .sw i{flex:1}
.swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.swatches input[type=color]{width:100%;height:26px;padding:0;border:1px solid #d5d9e0;border-radius:6px;background:#fff;cursor:pointer}
.ihead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
#interpOut h4{margin:12px 0 4px;font-size:13px;color:var(--ink2)}
ul.interp{margin:0;padding-left:18px;font-size:13.5px;line-height:1.55}ul.interp li{margin:5px 0}
#chartbox [data-edit]{cursor:text}#chartbox [data-edit]:hover{text-decoration:underline;fill:#2f6fed}
#chartbox [data-lg],#chartbox [data-grp],#chartbox [data-pan],#chartbox svg[data-geo] path[data-tip],#chartbox svg[data-geo] rect[data-tip],#chartbox svg[data-geo] polygon[data-tip]{cursor:grab}
#chartbox{touch-action:pan-y}
.inline-edit{position:absolute;z-index:20;height:32px;padding:0 10px;border:2px solid #2f6fed;border-radius:8px;font:inherit;font-size:14px;background:#fff;box-shadow:0 4px 16px rgba(20,30,50,.18)}
.patgrid{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.pgrow{display:grid;grid-template-columns:34px 1fr 128px;gap:8px;align-items:center;font-size:12.5px}
.pgrow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pgrow select{width:100%}
</style>
</head>
<body>
<header>
  <h1>Graph Maker</h1>
  <span class="sub">Plots, error bars &amp; statistics from your spreadsheet</span>
  <span class="sp"></span>
  <button class="btn" id="btnSvg">Save SVG</button>
  <button class="btn" id="btnPng">Save PNG</button>
  <button class="btn primary" id="btnCopyStats">Copy statistics</button>
</header>

<main>
<aside>
  <details class="card" open id="secData">
    <summary><span class="num">1</span> Data</summary>
    <div class="bd">
      <div class="drop" id="drop">Drop an Excel / CSV file here or <u>browse</u>
        <input type="file" id="file" accept=".xlsx,.xls,.xlsm,.csv,.tsv,.txt" hidden>
      </div>
      <div class="row"><span>Example</span>
        <select id="example">
          <option value="">Load an example…</option>
          <option value="ttest">Two groups (t-test)</option>
          <option value="oneway">One-way ANOVA (columns = groups)</option>
          <option value="twoway">Two-way ANOVA (long format)</option>
          <option value="threeway">Three-way ANOVA (long format)</option>
          <option value="volcano">Volcano (gene list)</option>
          <option value="scatter">Scatter / correlation (two groups)</option>
        </select></div>
      <details><summary class="hint" style="cursor:pointer">Or paste cells from Excel</summary>
        <textarea id="paste" placeholder="Paste here (first row = headers)…" spellcheck="false"></textarea>
        <div class="btns" style="margin-top:6px"><button class="btn sm" id="usePaste">Use pasted data</button></div>
      </details>
      <div id="sheetRow" class="row" style="display:none"><span>Sheet</span><select id="sheetSel"></select></div>
      <div id="dataMap"></div>
      <div id="preview" class="preview" style="display:none"></div>
    </div>
  </details>

  <details class="card" open id="secChart">
    <summary><span class="num">2</span> Chart</summary>
    <div class="bd">
      <div class="seg" id="chartSeg" role="group" aria-label="Chart type">
        <button data-chart="bar" aria-pressed="true">Bar</button>
        <button data-chart="box" aria-pressed="false">Box</button>
        <button data-chart="violin" aria-pressed="false">Violin</button>
        <button data-chart="dot" aria-pressed="false">Dot</button>
        <button data-chart="line" aria-pressed="false">Line</button>
        <button data-chart="hist" aria-pressed="false">Histogram</button>
        <button data-chart="scatter" aria-pressed="false">Scatter</button>
        <button data-chart="pie" aria-pressed="false">Pie</button>
        <button data-chart="volcano" aria-pressed="false">Volcano</button>
      </div>
      <div id="chartCtl" class="bd" style="padding:0"></div>
    </div>
  </details>

  <details class="card" open id="secStats">
    <summary><span class="num">3</span> Statistics</summary>
    <div class="bd" id="statsCtl"></div>
  </details>

  <details class="card" id="secStyle">
    <summary><span class="num">4</span> Labels &amp; style</summary>
    <div class="bd" id="styleCtl"></div>
  </details>
</aside>

<section class="out">
  <div class="card chartcard"><div id="chartbox"></div><div id="chartNote" class="legendnote"></div></div>
  <div class="card statscard" id="statsOut" style="display:none"></div>
  <div class="card statscard" id="interpOut" style="display:none"></div>
</section>
</main>
<div id="tip"></div><div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="stats.js"></script>
<script src="import.js"></script>
<script src="app.js"></script>
</body>
</html>
